name: Update UKPI site

on:
  schedule:
    - cron: '0 6 1,15 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run UKPI pipeline
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
        run: python main.py

      - name: Generate site
        run: python generate_site.py

      - name: Commit and push if changed
        run: |
          git config user.name "UKPI bot"
          git config user.email "actions@github.com"
          git add index.html data/
          git diff --staged --quiet || git commit -m "Auto-update UKPI: $(date +'%Y-%m-%d')"
          git push
